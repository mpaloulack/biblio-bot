name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Fails the build below 95% line coverage. The Discord gateway glue is
      # excluded; see scripts/coverage.sh for which files and why.
      - name: Coverage
        run: ./scripts/coverage.sh --summary-only

      - name: Coverage report
        run: ./scripts/coverage.sh --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  docker:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
