[package]
name = "biblio-bot"
version = "0.1.0"
edition = "2024"
description = "Discord bot that searches ebooks through Prowlarr and sends them to qBittorrent"
license = "MIT"
repository = "https://github.com/mpaloulack/biblio-bot"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
humansize = "2.1.3"
poise = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "cookies", "query", "form", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
